<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css_assets/style.css">
    <title>Keamogetswe Barbershop | Enquiry</title>
</head>
<body>
    <header>
        <h1>Keamogetswe Barbershop</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-form-section">
            <h2>Service Booking & General Enquiries</h2>
            <p>Fill out the form below to inquire about our services or book a dedicated appointment slot.</p>
            
            <!-- Service Enquiry Form -->
            <form action="#" method="post">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <label for="service">Requested Service:</label>
                <select id="service" name="service">
                    <option value="haircut">Classic Haircut</option>
                    <option value="fade">Skin Fade & Taper</option>
                    <option value="beard">Beard Grooming</option>
                    <option value="vip">VIP Package</option>
                </select>

                <label for="message">Message/Special Requests:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Keamogetswe Barbershop. All rights reserved.</p>
    </footer>
</body>
</html>
